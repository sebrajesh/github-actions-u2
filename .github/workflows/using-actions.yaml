name: using actions
on: 
  push:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code 
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v3 
        with:
          node-version: '24'

      - name: Install Dependencies
        working-directory: ./react-app
        run: npm ci 
        