name: Using variables

on:
  workflow_dispatch:

env: 
  WORKFLOW_VAR: "I'm a workflow env var"
  OVERWRITTEN: "I will be overwritten"
  UNDEFINED_VAR_WITH_DEFAULT: "${{ vars.UNDEFINED_VAR || 'default value' }}"


jobs:
  echo:
    runs-on: ubuntu-latest
    env: 
      JOB_VAR: "I'm a job var"
      OVERWRITTEN: 'I have been overwritten at the job level'
    steps:
      - name: Print Env variables
        env: 
          STEP_VAR: "I'm a step env var"
          STEP_VAR2: "I'm another step var"
        run: |
          echo "Step env var: $STEP_VAR"
          echo "Step env var 2: $STEP_VAR2"
          echo "Job env var: $JOB_VAR"
          echo "Workflow env var: $WORKFLOW_VAR"
          echo "Overwritten: $OVERWRITTEN"


      - name: Overwrite job variables
        env:
          OVERWRITTEN: "I have been overwritten at the step level"
        run: |
            echo "Step env var: $OVERWRITTEN"

  echo-2:
    runs-on: ubuntu-latest 
    steps:
      - name: Print variables
        run: |
          echo "Org var: ${{ vars.ORG_VAR || 'default value' }}"
          echo "Org overwritten var: ${{ vars.OVERWRITTEN_VAR || 'default value' }}"
          echo "Repo var: ${{ vars.REPOSITORY_VAR }}"

  echo-prod:
    runs-on: ubuntu-latest
    environment: prod
    steps:
      - name: Print prod variables
        run: |
          echo "Org var: ${{ vars.ORG_VAR || 'default value' }}"
          echo "Org overwritten var: ${{ vars.OVERWRITTEN_VAR || 'default value' }}"
          echo "Repo var: ${{ vars.REPOSITORY_VAR }}"
          echo "Environment var: ${{ vars.TARGET_VAR }}"

  echo-undefined:
    runs-on: ubuntu-latest
    steps:
      - name: Print Undefined Variables
        run: |
          echo "Org var: ${{ vars.UNDEFINED_VAR_WITH_DEFAULT }}" 
